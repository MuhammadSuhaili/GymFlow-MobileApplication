name: gym_flow
description: "GymFlow - Gym & Workout Management application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (sqflite on native, wasm sqlite on web)
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # HTTP (Aira chatbot)
  http: ^1.2.2

  # Charts
  fl_chart: ^0.70.2

  # Local notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  webview_flutter: ^4.14.1
  webview_flutter_android: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true